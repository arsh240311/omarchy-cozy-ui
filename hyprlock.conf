# Cozy Harbor AE86 Lockscreen Configuration

background {
    monitor =
    path = ~/.config/omarchy/themes/cozy-ui/backgrounds/cozy_harbor_ae86.jpg
    blur_passes = 2
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgba(ffb86caa)
    inner_color = rgba(24, 26, 36, 0.9)
    font_color = rgb(226, 228, 238)
    fade_on_empty = false
    placeholder_text = <span foreground="##5b627a">Enter password...</span>
    hide_input = false
    check_color = rgb(122, 162, 247)
    fail_color = rgb(247, 118, 142)
    fail_text = <i>Authentication failed ($ATTEMPTS)</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(226, 228, 238)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(155, 161, 184)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 10
    halign = center
    valign = center
}
